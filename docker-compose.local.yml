version: "3.9"

services:
  api:
    build: .
    container_name: runova-backend
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      - redis
    restart: always
    volumes:
      - /etc/runova/certs/global-bundle.pem:/app/certs/global-bundle.pem:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always


